<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CFI Global | Employee Result Portal</title>

<link rel="stylesheet" href="style.css">

<script src="data.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

background:linear-gradient(135deg,#001f3f,#003366);

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.login-container{

width:420px;

background:#ffffff;

padding:40px;

border-radius:12px;

box-shadow:0 15px 35px rgba(0,0,0,0.3);

text-align:center;

}

.logo{

width:120px;

margin-bottom:15px;

}

h1{

color:#003366;

margin-bottom:5px;

font-size:30px;

}

.subtitle{

color:#666;

margin-bottom:30px;

}

.input-group{

text-align:left;

margin-bottom:20px;

}

.input-group label{

display:block;

margin-bottom:8px;

font-weight:bold;

color:#333;

}

.input-group input{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:6px;

font-size:16px;

}

.input-group input:focus{

border-color:#003366;

outline:none;

}

button{

width:100%;

padding:14px;

background:#003366;

color:white;

border:none;

border-radius:6px;

font-size:17px;

cursor:pointer;

transition:.3s;

}

button:hover{

background:#0055aa;

}

#error{

margin-top:20px;

color:red;

font-weight:bold;

}

.footer{

margin-top:25px;

font-size:13px;

color:#777;

}

</style>

</head>

<body>

<div class="login-container">

<img src="logo.jpeg" class="logo">

<h1>CFI Global</h1>

<p class="subtitle">

Employee Assessment Portal

</p>

<div class="input-group">

<label>

Employee ID

</label>

<input

type="text"

id="employeeID"

placeholder="Enter Employee ID"

>

</div>

<div class="input-group">

<label>

Password

</label>

<input

type="password"

id="password"

placeholder="Enter Password"

>

</div>

<button onclick="login()">

Login

</button>

<p id="error"></p>

<div class="footer">

© 2026 Client First Innovate Pvt. Ltd.

</div>

</div>

<script src="employee-script.js"></script>

</body>

</html>
